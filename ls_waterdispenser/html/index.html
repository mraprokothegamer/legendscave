<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ls_waterdispenser</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app" class="hidden">
        <div class="cup">
            <div class="stream"></div>
            <div class="water">
                <div class="wave wave-a"></div>
                <div class="wave wave-b"></div>
            </div>
            <div class="shine"></div>
        </div>

        <div class="progress">
            <div class="progress-fill"></div>
        </div>

        <div class="label">Filling cup&hellip;</div>
    </div>

    <audio id="pour-sound" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
