<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legendscave Mini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden" aria-hidden="true">
    <div class="ipod" role="application" aria-label="Legendscave mini player">
      <button type="button" class="ipod__close" id="closeBtn" aria-label="Close">×</button>

      <div class="ipod__shell">
        <p class="ipod__wordmark">LEGENDSCAVE</p>

        <div class="ipod__bezel">
          <div class="lcd" id="lcd">
            <section class="lcd-view is-active" data-view="now" id="viewNow">
              <header class="lcd-bar">
                <span class="lcd-bar__brand">LEGENDSCAVE</span>
                <span class="lcd-bar__battery" aria-hidden="true">▮▮▮</span>
              </header>
              <p class="lcd-eyebrow" id="lcdStatus">Ready</p>
              <p class="lcd-title" id="nowTitle">Select a track</p>
              <p class="lcd-artist" id="nowArtist">—</p>
              <div class="lcd-eq" id="eq" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
              <div class="lcd-progress">
                <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                  <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-counter">
                  <span id="elapsed">0:00</span>
                  <span id="duration">0:00</span>
                </div>
              </div>
            </section>

            <section class="lcd-view" data-view="menu" id="viewMenu">
              <header class="lcd-bar">
                <span class="lcd-bar__brand">Menu</span>
                <span class="lcd-bar__hint">wheel</span>
              </header>
              <ul class="menu-list" id="playlist" aria-label="Playlist"></ul>
            </section>

            <section class="lcd-view" data-view="url" id="viewUrl">
              <header class="lcd-bar">
                <span class="lcd-bar__brand">Paste URL</span>
              </header>
              <p class="lcd-hint">YouTube link or video ID</p>
              <input id="ytUrl" class="lcd-input" type="text" placeholder="youtube.com/watch?v=…" autocomplete="off" spellcheck="false" />
              <button type="button" class="lcd-go" id="playCustomBtn">Play</button>
            </section>
          </div>
        </div>

        <div class="wheel" id="wheel" aria-label="Click wheel">
          <button type="button" class="wheel__seg wheel__seg--menu" id="menuBtn" aria-label="Menu">MENU</button>
          <button type="button" class="wheel__seg wheel__seg--prev" id="prevBtn" aria-label="Previous">⏮</button>
          <button type="button" class="wheel__seg wheel__seg--next" id="nextBtn" aria-label="Next">⏭</button>
          <button type="button" class="wheel__seg wheel__seg--play" id="playBtn" aria-label="Play or stop">
            <span id="playIcon">▶❚❚</span>
          </button>
          <button type="button" class="wheel__center" id="selectBtn" aria-label="Select">
            <span class="wheel__center-label">SELECT</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
