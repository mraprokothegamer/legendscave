<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Dispenser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="fill-ui" class="hidden">
        <div class="panel">
            <div class="title">Filling cup</div>
            <div class="cup-wrap">
                <div class="cup">
                    <div class="water">
                        <div class="wave wave-1"></div>
                        <div class="wave wave-2"></div>
                    </div>
                </div>
                <div class="stream"></div>
            </div>
            <div class="hint">Hold still...</div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
