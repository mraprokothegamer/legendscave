<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Dispenser</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
    <div id="nui-root" class="pos-bottom-right">
        <div id="fill-ui" class="hidden">
            <div class="panel">
                <div class="title">Filling cup</div>

                <div class="dispenser-stack">
                    <div class="nozzle">
                        <div class="nozzle-tip"></div>
                    </div>
                    <div class="stream"></div>

                    <div class="cup-wrap">
                        <div class="cup">
                            <div class="water">
                                <div class="surface">
                                    <div class="wave wave-1"></div>
                                    <div class="wave wave-2"></div>
                                </div>
                            </div>
                            <div class="cup-shine"></div>
                        </div>
                    </div>
                </div>

                <div class="progress-wrap">
                    <div class="progress-track">
                        <div class="progress-fill"></div>
                    </div>
                    <div class="progress-label">
                        <span class="hint">Hold still...</span>
                        <span class="percent">0%</span>
                    </div>
                </div>

                <div class="version">UI v2.0.6 · Far right · Right hand</div>
            </div>
        </div>
    </div>
    <script src="app.js?v=6"></script>
</body>
</html>
